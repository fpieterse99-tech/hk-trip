:root{--ink:#0E2A3B;--mute:#4B6070;--soft:#6E8796;--mist:#EAF3F7;--line:#E1E8EC;--blue:#1478A8;--green:#1F7A4C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fff;color:var(--ink);font-family:Arc,system-ui,-apple-system,"Noto Sans CJK TC","PingFang HK",sans-serif;font-size:16px;line-height:1.4}
button{font:inherit;color:inherit}
a{color:inherit}
.zh{font-family:system-ui,"PingFang HK","Noto Sans CJK TC",sans-serif;color:var(--mute);font-weight:400}
#top{position:sticky;top:0;z-index:5;background:#fff;padding:calc(env(safe-area-inset-top) + 10px) 18px 8px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line)}
#top b{font-family:BSD;font-weight:800;font-size:22px;letter-spacing:.3px}
#clock{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
main{max-width:560px;margin:0 auto;padding:14px 18px calc(96px + env(safe-area-inset-bottom))}
nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav#tabs a{flex:1;text-align:center;text-decoration:none;font-size:11.5px;font-weight:600;color:var(--soft);padding:4px 0}
nav#tabs a svg{display:block;margin:0 auto 2px;width:24px;height:24px}
nav#tabs a.on{color:var(--ink)}
h1{font-family:BSD;font-weight:800;font-size:46px;line-height:.9;margin:6px 0 2px}
h2{font-family:BSD;font-weight:800;font-size:28px;line-height:1;margin:22px 0 8px}
h3{margin:18px 0 6px;font-size:16px}
.theme{font-family:BSD;font-weight:800;font-size:20px;color:var(--mute)}
.kick{font-weight:600;color:var(--blue);font-size:14px}
.blurb{margin:10px 0 12px;color:#26404F}
.tiles{width:100%;display:block;margin-top:10px}
.ts{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.dchips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.dchip{flex:none;border:1.5px solid var(--ink);border-radius:999px;padding:6px 13px;font-weight:700;font-size:14px;background:#fff;text-decoration:none}
.dchip.on{background:var(--ink);color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ink);border-radius:999px;padding:3px 10px 3px 3px;font-size:13px;font-weight:600;background:#fff;cursor:pointer}
.chip b{background:var(--ink);color:#fff;border-radius:999px;padding:1px 7px;font-size:12px}
.fchip{border:1.5px solid #B9CFD9;border-radius:999px;padding:5px 11px;font-size:13.5px;font-weight:600;background:#fff}
.fchip.on{border-color:var(--ink);background:var(--ink);color:#fff}

.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:12px;padding:12px 14px;font-weight:700;font-size:15px;background:var(--ink);color:#fff;text-decoration:none;cursor:pointer}

.idea.pick{background:#F2ECFA;border-radius:12px;padding:11px 10px;margin:0 -10px;border:none}
.yp{font-size:12px;font-weight:700;color:#7B3FBF}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;margin:10px 0}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.mapbtn{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:14px 16px;margin:8px 0;cursor:pointer}
.mapbtn b{display:block;font-size:16px}
.mapbtn small{color:var(--mute);font-size:13px}
.thumb{width:100%;border-radius:12px;overflow:hidden;border:1px solid #CFDDE4;margin:6px 0 4px;cursor:zoom-in}

.map .pnum{font-family:Arc;font-weight:700;fill:#fff}

.map .credit{font-family:Arc;font-size:17px;fill:#6E8796}

.grab{width:42px;height:5px;border-radius:3px;background:#CFDDE4;margin:2px auto 10px}

.tl{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:center;margin:4px 0}

.wx{border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;margin:12px 0}

.warnb{display:inline-block;background:#B3123A;color:#fff;border-radius:8px;padding:3px 9px;font-weight:700;font-size:13px;margin:6px 6px 0 0}

.acc .body{padding:0 0 12px;display:none}
.acc.open .body{display:block}
.chk{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk .tick{flex:none}
.chk.done .tick{background:var(--green);border-color:var(--green)}
.chk.done span{color:var(--soft);text-decoration:line-through}
.opt1{display:grid;grid-template-columns:28px 1fr;gap:10px;margin:8px 0;font-size:15px}
.rank{background:var(--green);color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.rank.alt{background:#8A96A3}
table.tt{width:100%;border-collapse:collapse;font-size:15px}

table.tt td:last-child{text-align:right;font-weight:700;white-space:nowrap}
.trade{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin:8px 0;font-weight:700}
.trade span{color:#fff;border-radius:7px;padding:3px 8px;font-size:13px;font-weight:600}
input[type=date],input[type=time]{font:inherit;font-size:17px;padding:10px 12px;border:1.5px solid #B9CFD9;border-radius:12px;width:100%;background:#fff;color:var(--ink)}
.muted{color:var(--mute);font-size:13.5px}
.big{font-family:BSD;font-weight:800;font-size:64px;line-height:1}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KEY = "hktrip-v1";
let S = Object.assign({start:null, done:{}, swap:{}, extra:{}, checks:{}, filt:"all"}, JSON.parse(localStorage.getItem(KEY) || "{}"));
const save = () => localStorage.setItem(KEY, JSON.stringify(S));
const C = DATA.cats;
const ORDER = ["mon","tue","wed","thu","fri","sat","sun"];
const DAY = Object.fromEntries(DATA.days.map(d => [d.key, d]));

const toMin = t => { const [h, m] = t.split(":").map(Number); return h*60 + m; };
const card = code => DATA.swaps.find(s => s.code === code) || DATA.food.find(f => f.code === code);

function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1800); }
function hkNow(){
  const o = {}; new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Hong_Kong",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"})
    .formatToParts(new Date()).forEach(p => o[p.type] = p.value);
  return {date:`${o.year}-${o.month}-${o.day}`, min:(+o.hour)*60 + (+o.minute), hm:`${o.hour}:${o.minute}`};
}
function tripIndex(){ if(!S.start) return null; return Math.round((Date.parse(hkNow().date) - Date.parse(S.start)) / 864e5); }
function shade(hex, f){ const c=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)).map(v=>Math.max(0,Math.min(255,Math.round(f>0? v+(255-v)*f : v*(1+f))))); return "#"+c.map(v=>v.toString(16).padStart(2,"0")).join(""); }

function dayItems(key){
  const d = DAY[key]; if(!d) return [];
  const its = d.items.map(it => {
    const sc = S.swap[it.id];
    if(sc){ const c = card(sc); if(c) return {...it, swapped:sc, orig:it.title, title:c.name, zh:c.zh, note:c.desc, cat:c.cat, maps:c.maps, pin:null, fixed:false}; }
    return it;
  });
  (S.extra[key] || []).forEach((e, i) => { const c = card(e.code); if(c) its.push({id:`${key}-x${i}`, t:e.t, cat:c.cat, title:c.name, zh:c.zh, note:c.desc, maps:c.maps, extra:i, code:e.code}); });
  return its.sort((a, b) => a.t.localeCompare(b.t));
}
function tiles(key){
  const d = DAY[key], its = dayItems(key).filter(i => !i.opt && i.extra === undefined), slots = Array(56).fill(null);
  its.forEach((it, k) => { const s = toMin(it.t), e = k+1 < its.length ? toMin(its[k+1].t) : toMin(d.end);
    for(let m = s; m < e; m += 15){ const i = (m-480)/15|0; if(i >= 0 && i < 56) slots[i] = it.cat; } });
  let seed = key.charCodeAt(0)*7; const rnd = () => (seed = (seed*9301+49297)%233280)/233280;
  const r = slots.map((c, i) => { const q = i%28, row = i/28|0; const col = shade(c ? C[c].color : "#E6ECEF", rnd()*0.18-0.08);
    return `<rect x="${q*12}" y="${row*12}" width="10" height="10" rx="1.2" fill="${col}"/>`; }).join("");
  return `<svg class="tiles" viewBox="0 0 334 22">${r}</svg><div class="ts"><span>8am</span><span>3pm</span><span>10pm</span></div>`;
}
function rowHTML(it, opts={}){
  const col = C[it.cat].color, done = S.done[it.id];
  const b = [];
  if(it.pin) b.push(`<span class="pin" style="background:${col}">${it.pin}</span>`);
  if(it.fixed) b.push(`<span class="bdg">Fixed time</span>`);
  if(it.swapped) b.push(`<span class="bdg sw">Swapped in</span>`);
  if(it.extra !== undefined) b.push(`<span class="bdg sw">Added</span>`);
  if(it.opt) b.push(`<span class="bdg opt">Optional</span>`);
  return `<div class="row ${done?"done":""} ${opts.past?"past":""} ${opts.cur?"cur":""}" data-item="${it.id}">
   <div class="t">${it.t}</div><div class="bar" style="background:${col};${it.opt?"opacity:.45":""}"></div>
   <div><div class="ti">${esc(it.title)}${it.zh?` <span class="zh">${esc(it.zh)}</span>`:""}</div>${it.note?`<div class="no">${esc(it.note)}</div>`:""}${b.length?`<div class="badges">${b.join("")}</div>`:""}</div>

function timeline(key, now){
  const its = dayItems(key);
  let curIdx = -1;
  if(now !== undefined) its.forEach((it, i) => { if(toMin(it.t) <= now) curIdx = i; });

  }
  if(idx > 6) return `<div class="kick">Home again</div><h1>Hope it was brilliant</h1><p class="blurb">Your plan is still here in the Plan tab.</p>`;
  const key = ORDER[idx];
  if(key === "mon"){

  }
  const d = DAY[key], its = dayItems(key);

  h += `<div class="kick">Day ${idx} of 6</div><h1>${d.name}</h1><div class="theme">${esc(d.theme)}</div>${tiles(key)}`;

  h += `<div id="wx"></div>`;
  h += `<h2>Today</h2>${timeline(key, n.min)}`;
  h += `<h2>Plan B</h2>${planB(key)}`;
  return h + quick();
}

function mapViewer(key){
  const m = DATA.maps[key];
  const el = document.createElement("div"); el.className = "mv";
  const leg = m.legend ? DATA.legend.map(l => `<div class="tl"><i class="${l.dash?"dash":""}" style="${l.dash?`border-color:${l.color}`:`background:${l.color}`}"></i><span><b style="color:var(--ink)">${esc(l.name)}</b> ${esc(l.use)}</span></div>`).join("") : esc(m.sub);
  el.innerHTML = `<header><b>${esc(m.title)}</b><span><button class="btn sec" data-reset style="padding:8px 12px">Reset</button> <button class="btn" data-mvclose style="padding:8px 14px">Close</button></span></header><div class="mvwrap"><div class="mvin">${m.svg}</div></div><div class="mvfoot">${leg}</div>`;
  document.body.appendChild(el); history.pushState({mv:1}, "");
  const wrap = el.querySelector(".mvwrap"), inner = el.querySelector(".mvin");
  let sc = 1, tx = 0, ty = 0;
  const fit = () => { const svg = inner.querySelector("svg"); const r = wrap.getBoundingClientRect(); const vb = svg.viewBox.baseVal; const ratio = vb.height/vb.width;
    const w = Math.min(r.width, r.height/ratio); inner.style.width = w + "px"; sc = 1; tx = (r.width - w)/2; ty = Math.max(0, (r.height - w*ratio)/2); apply(); };
  const apply = () => inner.style.transform = `translate(${tx}px,${ty}px) scale(${sc})`;
  const zoomAt = (f, x, y) => { const ns = Math.max(1, Math.min(10, sc*f)); tx = x - (x - tx)*(ns/sc); ty = y - (y - ty)*(ns/sc); sc = ns; apply(); };
  const P = new Map(); let last = null, lastTap = 0;
  wrap.addEventListener("pointerdown", e => { wrap.setPointerCapture(e.pointerId); P.set(e.pointerId, {x:e.clientX, y:e.clientY}); last = null;
    const now = Date.now(); if(P.size === 1 && now - lastTap < 300){ const r = wrap.getBoundingClientRect(); zoomAt(2.2, e.clientX - r.left, e.clientY - r.top); } lastTap = now; });
  wrap.addEventListener("pointermove", e => {
    if(!P.has(e.pointerId)) return; const prev = P.get(e.pointerId); P.set(e.pointerId, {x:e.clientX, y:e.clientY});
    const r = wrap.getBoundingClientRect();
    if(P.size === 1){ tx += e.clientX - prev.x; ty += e.clientY - prev.y; apply(); }
    else if(P.size === 2){ const [a, b] = [...P.values()]; const d = Math.hypot(a.x-b.x, a.y-b.y), mx = (a.x+b.x)/2 - r.left, my = (a.y+b.y)/2 - r.top;
      if(last){ tx += mx - last.mx; ty += my - last.my; zoomAt(d/last.d, mx, my); } last = {d, mx, my}; }
  });
  const up = e => { P.delete(e.pointerId); last = null; };
  wrap.addEventListener("pointerup", up); wrap.addEventListener("pointercancel", up);
  wrap.addEventListener("wheel", e => { e.preventDefault(); const r = wrap.getBoundingClientRect(); zoomAt(e.deltaY < 0 ? 1.15 : 1/1.15, e.clientX - r.left, e.clientY - r.top); }, {passive:false});
  el.querySelector("[data-reset]").onclick = fit;
  el.querySelector("[data-mvclose]").onclick = () => history.back();
  requestAnimationFrame(fit);
}

/* ---------- weather (Hong Kong Observatory open data) ---------- */
const WARN = {TC1:"Standby Signal No. 1",TC3:"Strong Wind Signal No. 3",TC8NE:"Gale Signal No. 8",TC8SE:"Gale Signal No. 8",TC8SW:"Gale Signal No. 8",TC8NW:"Gale Signal No. 8",TC9:"Signal No. 9",TC10:"Hurricane Signal No. 10",WRAINA:"Amber Rainstorm",WRAINR:"Red Rainstorm",WRAINB:"Black Rainstorm",WTS:"Thunderstorm warning",WHOT:"Very Hot weather warning"};
const SEVERE = ["TC8NE","TC8SE","TC8SW","TC8NW","TC9","TC10","WRAINR","WRAINB"];
async function loadWx(){
  const box = $("#wx"); if(!box) return;
  let W = null;
  try{
    const base = "https://data.weather.gov.hk/weatherAPI/opendata/weather.php?lang=en&dataType=";
    const [w, r, f] = await Promise.all(["warnsum","rhrread","fnd"].map(t => fetch(base + t, {cache:"no-store"}).then(x => x.json())));
    const warns = Object.values(w || {}).filter(x => x && x.code && x.actionCode !== "CANCEL").map(x => ({code:x.code, name:WARN[x.code] || x.name}));
    const td = (r.temperature && r.temperature.data) || [];
    const t = td.find(x => x.place === "Hong Kong Observatory") || td.find(x => x.place === "Tung Chung") || td[0];
    const fc = (f.weatherForecast || []).slice(0, 3).map(x => ({d:(x.week||"").slice(0,3), max:x.forecastMaxtemp && x.forecastMaxtemp.value, min:x.forecastMintemp && x.forecastMintemp.value, psr:x.PSR}));
    W = {t: t ? t.value : null, warns, fc, at: Date.now()};
    localStorage.setItem("hkwx", JSON.stringify(W));
  }catch(e){ const c = localStorage.getItem("hkwx"); if(c) W = {...JSON.parse(c), stale:true}; }
  if(!W){ box.innerHTML = `<div class="wx"><b>Weather</b><p class="muted" style="margin:4px 0 0">Not available right now. Check the MyObservatory app.</p></div>`; return; }
  const age = W.stale ? `<p class="muted" style="margin:6px 0 0">Saved ${new Date(W.at).toLocaleString()}. You're offline.</p>` : "";
  box.innerHTML = `<div class="wx"><div style="display:flex;justify-content:space-between;align-items:baseline"><span class="now">${W.t ?? "–"}°</span><span class="muted">Hong Kong now</span></div>
    ${W.warns.length ? W.warns.map(x => `<span class="warnb ${SEVERE.includes(x.code)?"":"mild"}">${esc(x.name)}</span>`).join("") : `<p class="muted" style="margin:6px 0 0">No weather warnings in force.</p>`}
    ${W.warns.some(x => SEVERE.includes(x.code)) ? `<p style="margin:8px 0 0"><a href="#info/change" style="font-weight:700">See what to do</a></p>` : ""}
    <div class="fc">${W.fc.map(x => `<div><b>${esc(x.d)}</b><br>${x.min}–${x.max}°<br>Rain: ${esc(x.psr || "")}</div>`).join("")}</div>${age}</div>`;
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-tick],[data-item],[data-card],[data-taxi],[data-map],[data-filt],[data-acc],[data-chk],[data-close],[data-swapfor],[data-pick],[data-unswap],[data-rmextra],[data-addday],[data-add],#startSave,#resetAll,.bg");
  if(!t) return;
  const d = t.dataset;
  if(t.classList.contains("bg") || d.close !== undefined) return closeSheet();
  if(d.tick){ e.stopPropagation(); S.done[d.tick] = !S.done[d.tick]; save(); const inSheet = t.closest("#sheet"); render(); if(inSheet) closeSheet(); return; }
  if(d.item) return itemSheet(d.item);
  if(d.pick){ S.swap[d.for] = d.pick; save(); closeSheet(); render(); toast("Swapped in " + card(d.pick).name); return; }
  if(d.card) return cardSheet(d.card);
  if(d.taxi) return taxi(d.taxi);
  if(d.map) return mapViewer(d.map);
  if(d.filt){ S.filt = d.filt; save(); return render(); }
  if(d.acc){ const el = document.getElementById("acc-" + d.acc); el.classList.toggle("open"); el.querySelector("button span:last-child").textContent = el.classList.contains("open") ? "−" : "+"; return; }
  if(d.chk !== undefined){ S.checks[d.chk] = !S.checks[d.chk]; save(); t.classList.toggle("done"); t.querySelector(".tick").textContent = S.checks[d.chk] ? "✓" : ""; return; }
  if(d.swapfor) return swapPicker(d.swapfor);
  if(d.unswap){ delete S.swap[d.unswap]; save(); closeSheet(); render(); toast("Back to the original plan"); return; }
  if(d.rmextra){ const [k, x] = d.rmextra.split("-x"); S.extra[k].splice(+x, 1); save(); closeSheet(); render(); toast("Removed"); return; }
  if(d.addday){ addDay = d.addday; document.querySelectorAll("[data-addday]").forEach(b => b.classList.toggle("on", b === t)); return; }
  if(d.add){ if(!addDay){ toast("Pick a day first"); return; } const tm = $("#addTime").value || "15:00"; (S.extra[addDay] = S.extra[addDay] || []).push({code:d.add, t:tm}); save(); closeSheet(); toast(`Added to ${NAME[addDay]} at ${tm}`); addDay = null; render(); return; }
  if(t.id === "startSave"){ const v = $("#startIn").value; if(!v){ toast("Pick a date first"); return; } S.start = v; save(); if(new Date(v + "T12:00:00").getDay() !== 1) toast("Saved. Note: that date isn't a Monday"); else toast("Saved"); location.hash = "#today"; render(); return; }
  if(t.id === "resetAll"){ if(confirm("Clear all ticks, swaps and added cards?")){ S.done = {}; S.swap = {}; S.extra = {}; save(); toast("Reset"); render(); } return; }
});
window.addEventListener("hashchange", render);
window.addEventListener("popstate", () => { const tx = document.querySelector(".taxi"); if(tx){ tx.remove(); return; } const mv = document.querySelector(".mv"); if(mv){ mv.remove(); return; } if($("#ov").classList.contains("show")) closeSheet(true); });
function tick(){ $("#clock").textContent = "Hong Kong " + hkNow().hm; }
tick(); setInterval(() => { tick(); if((location.hash || "#today").startsWith("#today") && !$("#ov").classList.contains("show") && !document.querySelector(".mv,.taxi")) { const y = window.scrollY; render(); window.scrollTo(0, y); } }, 60000);
render();
if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
