# Builds the HK Trip app every time you change a file in this repository.
# 1. Publishes it as a website you can add to your home screen (GitHub Pages).
# 2. Builds an Android app (APK) and attaches it to a Release.
name: Build trip app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make the app files
        run: |
          mkdir -p site
          cp index.html site/

          cat > site/manifest.webmanifest <<'EOF'
          {
            "name": "HK Trip",
            "short_name": "HK Trip",
            "start_url": "./",
            "scope": "./",
            "display": "standalone",
            "background_color": "#ffffff",
            "theme_color": "#0E2A3B",
            "icons": [
              {"src": "icon-192.png", "sizes": "192x192", "type": "image/png", "purpose": "any maskable"},
              {"src": "icon-512.png", "sizes": "512x512", "type": "image/png", "purpose": "any maskable"}
            ]
          }
          EOF

          cat > site/sw.js <<'EOF'
          const CACHE = "hktrip-cache";
          const FILES = ["./", "./index.html", "./manifest.webmanifest", "./icon-192.png", "./icon-512.png"];
          self.addEventListener("install", e => { e.waitUntil(caches.open(CACHE).then(c => c.addAll(FILES))); self.skipWaiting(); });
          self.addEventListener("activate", e => { e.waitUntil(self.clients.claim()); });
          self.addEventListener("fetch", e => {
            if (new URL(e.request.url).origin !== location.origin) return;
            e.respondWith(
              fetch(e.request)
                .then(r => { const copy = r.clone(); caches.open(CACHE).then(c => c.put(e.request, copy)); return r; })
                .catch(() => caches.match(e.request).then(r => r || caches.match("./index.html")))
            );
          });
          EOF

          cat > icon.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
            <rect width="512" height="512" fill="#0E2A3B"/>
            <g transform="translate(148 148)">
              <rect x="0" y="0" width="64" height="64" rx="10" fill="#1F7A4C"/>
              <rect x="76" y="0" width="64" height="64" rx="10" fill="#1478A8"/>
              <rect x="152" y="0" width="64" height="64" rx="10" fill="#1478A8"/>
              <rect x="0" y="76" width="64" height="64" rx="10" fill="#E39B0B"/>
              <rect x="76" y="76" width="64" height="64" rx="10" fill="#7B3FBF"/>
              <rect x="152" y="76" width="64" height="64" rx="10" fill="#D6336C"/>
              <rect x="0" y="152" width="64" height="64" rx="10" fill="#C8102E"/>
              <rect x="76" y="152" width="64" height="64" rx="10" fill="#E39B0B"/>
              <rect x="152" y="152" width="64" height="64" rx="10" fill="#FFFFFF"/>
            </g>
          </svg>
          EOF

          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 192 -h 192 icon.svg -o site/icon-192.png
          rsvg-convert -w 512 -h 512 icon.svg -o site/icon-512.png
          ls -la site

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site

  website:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: www
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build the APK
        run: |
          npm init -y > /dev/null
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "HK Trip" com.hktrip.companion --web-dir www
          npx cap add android
          RES=android/app/src/main/res
          rm -f $RES/mipmap-anydpi-v26/ic_launcher.xml $RES/mipmap-anydpi-v26/ic_launcher_round.xml
          for d in $RES/mipmap-*dpi; do
            cp www/icon-192.png $d/ic_launcher.png
            cp www/icon-192.png $d/ic_launcher_round.png
          done
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../HK-Trip.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HK-Trip-android
          path: HK-Trip.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: HK Trip app, build ${{ github.run_number }}
          body: Open this page on your Android phone, tap HK-Trip.apk to download, then open it to install.
          files: HK-Trip.apk
